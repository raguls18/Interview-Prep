<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
    <div id="auth-container" class="auth-wrapper">
        <div class="auth-card glass-panel" id="login-card">
            <h1 class="logo">Antigravity<span class="dot">.</span></h1>
            <p class="auth-subtitle">Sign in to manage your tasks</p>

            <form id="login-form">
                <div class="input-group">
                    <span class="material-symbols-rounded icon">mail</span>
                    <input type="email" id="login-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <span class="material-symbols-rounded icon">lock</span>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <p class="switch-auth">Don't have an account? <a href="#" id="show-register">Create one</a></p>
        </div>

        <div class="auth-card glass-panel hidden" id="register-card">
            <h1 class="logo">Antigravity<span class="dot">.</span></h1>
            <p class="auth-subtitle">Create your account</p>

            <form id="register-form">
                <div class="input-group">
                    <span class="material-symbols-rounded icon">person</span>
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <span class="material-symbols-rounded icon">mail</span>
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <span class="material-symbols-rounded icon">lock</span>
                    <input type="password" id="reg-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <p class="switch-auth">Already have an account? <a href="#" id="show-login">Sign In</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
